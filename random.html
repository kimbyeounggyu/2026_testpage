<section>
<h2>식사 랜덤 뽑기</h2>
  <script>
    // 3. prompt()로 콤마(,)로 구분된 항목 입력받기 (기본값 설정)
    let inputString = prompt("콤마(,)로 구분된 항목을 입력하세요.", "짜장면, 짬뽕, 제육볶음");

    // 4. 입력 취소 또는 빈 값 확인
    if (!inputString) {
      document.write("뽑기를 취소했습니다.");
    } else {
      // 5. 콤마(,)를 기준으로 문자열을 나누어 배열에 저장
      let items = inputString.split(',');

      // 6~7. 0부터 (배열 길이 - 1) 사이의 랜덤 정수 인덱스 생성
      let index = Math.floor(Math.random() * items.length);

      // 8. 해당 인덱스의 항목을 choice 변수에 저장
      let choice = items[index];

      // 9. 양쪽 공백 제거
      choice = choice.trim();

      // 10. 최종 결과 출력
      document.write("오늘의 추천 메뉴: " + choice);
    }
  </script>
</section>
