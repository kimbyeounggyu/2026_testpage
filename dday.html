 <section>
  <h2>D-Day 계산기</h2>
  <script>
    // 3. 오늘 날짜 객체 생성
    let now = new Date();

    // 4. prompt()로 연도, 월, 일 입력받기
    let yearStr = prompt("연도를 입력하세요 (예: 2026)");
    let monthStr = prompt("월을 입력하세요 (1~12)");
    let dayStr = prompt("일을 입력하세요 (1~31)");

    // 5. 입력 취소 또는 빈 값 확인
    if (!yearStr) {
      document.write("계산을 취소했습니다.");
    } else {
      // 6. 문자열을 숫자형으로 변환
      let year = parseInt(yearStr);
      let month = parseInt(monthStr);
      let day = parseInt(dayStr);

      // 7. 목표 날짜 객체 생성 (월은 0부터 시작하므로 1을 뺌)
      let targetDate = new Date(year, month - 1, day);

      // 8. 두 날짜의 밀리초(ms) 차이 계산
      let diffMs = targetDate.getTime() - now.getTime();

      // 9. 밀리초를 일(day) 단위로 변환 후 올림 처리
      let diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

      // 10. 조건에 따른 D-Day 결과 출력
      if (diffDay === 0) {
        document.write("D-Day");
      } else if (diffDay > 0) {
        document.write("D-" + diffDay);
      } else {
        document.write("D+" + Math.abs(diffDay));
      }
    }
  </script>
